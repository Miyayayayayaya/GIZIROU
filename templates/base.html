<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="会議後の議事録整理とフォローアップを支援するAIエージェント">
    <title>{% block title %}議事郎{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260827') }}">
    <script src="{{ url_for('static', filename='js/app.js', v='20260827') }}" defer></script>
  </head>
  <body data-page="{% block page_name %}{% endblock %}">
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="議事郎 ホーム">
        <span class="brand-mark" aria-hidden="true">議</span>
        <span>議事郎</span>
      </a>
      {% if current_user_email %}
        <div class="header-actions">
          <a class="header-link" href="{{ url_for('list_meetings') }}">会議履歴</a>
          <span class="user-email" title="{{ current_user_email }}">{{ current_user_email }}</span>
          <form class="logout-form" action="{{ url_for('google_disconnect') }}" method="post">
            <button class="header-button" type="submit">ログアウト</button>
          </form>
        </div>
      {% else %}
        <span class="status-badge">Human reviewed</span>
      {% endif %}
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <p>AIの生成内容は、必ず確認・編集してから利用してください。</p>
    </footer>
  </body>
</html>
